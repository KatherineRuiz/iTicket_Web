<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iTicket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/notificaciones.css">
  <link rel="stylesheet" href="css/chatBot.css" />
  <script src="js/components/menu-cache.js?v=17"></script>
</head>

<body>
  <!-- Todo el header  -->
  <header id="contenedorMenuLateral"></header>
  <div class="menu-lateral-overlay" id="overlay"></div>

  <main class="main px-md-4 py-3">
    <section class="chat container px-0 d-flex flex-column justify-content-between">
      <div class="encabezado d-flex justify-content-between align-items-center fs-5 text-secondary px-4 pt-2 shadow-sm">
        <div class="d-flex gap-2">
          <svg width="38" height="42" viewBox="0 0 52 46" fill="none" xmlns="http://www.w3.org/2000/svg"
            class="d-flex chatbot-svg">
            <path
              d="M26 10.844V2H16.4M33.2 21.899V26.321M2 24.11H6.8M45.2 24.11H50M18.8 21.899V26.321M45.2 32.954C45.2 34.1268 44.6943 35.2516 43.7941 36.0809C42.8939 36.9101 41.673 37.376 40.4 37.376H18.3872C17.1143 37.3763 15.8936 37.8423 14.9936 38.6717L9.7088 43.5403C9.47049 43.7598 9.16689 43.9093 8.83637 43.9698C8.50586 44.0304 8.16328 43.9993 7.85194 43.8805C7.5406 43.7617 7.27449 43.5605 7.08725 43.3024C6.9 43.0443 6.80004 42.7408 6.8 42.4304V15.266C6.8 14.0932 7.30571 12.9685 8.20589 12.1392C9.10606 11.3099 10.327 10.844 11.6 10.844H40.4C41.673 10.844 42.8939 11.3099 43.7941 12.1392C44.6943 12.9685 45.2 14.0932 45.2 15.266V32.954Z"
              stroke="#6c757d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>
            <p class="fw-bold mb-0">Botick</p>
            <p class="subtitulo mb-1">Asistente virtual</p>
          </div>
        </div>
        <button type="button" class="rounded-5 btn btn-link" data-bs-container="body" data-bs-toggle="popover"
          data-bs-placement="bottom"
          data-bs-content="Pregunta sobre tus tickets, información de interés de las solicitudes y cómo solucionar problemas sencillos">
          <i class="bi bi-question-circle-fill text-secondary"></i>
        </button>
      </div>
      <div class="cuerpo-chat" id="cuerpoChat">
        <!--Mensaje del bot-->
        <div class="d-flex align-items-end gap-3">
          <div class="perfil-bot p-2 rounded-pill">
            <svg width="22" height="25" viewBox="0 0 52 46" fill="none" xmlns="http://www.w3.org/2000/svg"
              class="d-flex chatbot-svg">
              <path
                d="M26 10.844V2H16.4M33.2 21.899V26.321M2 24.11H6.8M45.2 24.11H50M18.8 21.899V26.321M45.2 32.954C45.2 34.1268 44.6943 35.2516 43.7941 36.0809C42.8939 36.9101 41.673 37.376 40.4 37.376H18.3872C17.1143 37.3763 15.8936 37.8423 14.9936 38.6717L9.7088 43.5403C9.47049 43.7598 9.16689 43.9093 8.83637 43.9698C8.50586 44.0304 8.16328 43.9993 7.85194 43.8805C7.5406 43.7617 7.27449 43.5605 7.08725 43.3024C6.9 43.0443 6.80004 42.7408 6.8 42.4304V15.266C6.8 14.0932 7.30571 12.9685 8.20589 12.1392C9.10606 11.3099 10.327 10.844 11.6 10.844H40.4C41.673 10.844 42.8939 11.3099 43.7941 12.1392C44.6943 12.9685 45.2 14.0932 45.2 15.266V32.954Z"
                stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="mensaje bot animar-mensaje shadow-sm">
            <p id="txtChatInicio">
              ¡Hola! Bienvenido al sistema de soporte. Veo que tenemos
              <strong>36 tickets abiertos</strong>. ¿Quieres consultar algo?
            </p>
            <p>Sugerencias:</p>
            <div class="sugerencias">
              <button id="btnSugerencia1">
                Ver resumen de los tickets activos
              </button>
              <button id="btnSugerencia2">
                Ver los tickets con calificaciones bajas en el mes
              </button>
              <button id="btnSugerencia3">
                Ver las ubicaciones con mayor cantidad de tickets este mes
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="px-md-5 px-sm-0 pb-3 w-75 mx-auto">
        <div class="chat-input-wrapper input-group rounded-pill p-2 align-items-center">
          <span class="input-group-text bg-transparent border-0 ps-3">
            <i class="bi bi-mic text-muted"></i>
          </span>
          <textarea class="form-control border-0 bg-transparent mx-1" placeholder="Escribe tu consulta aquí..."
            aria-label="Escribe tu consulta..." rows="1" id="txtChat"></textarea>
          <button class="btn btn-oscuro-redondeado btn-enviar d-flex align-items-center gap-2 pe-3 text-white rounded-5" type="button"
            id="btnEnviar">
            <i class="bi bi-send-fill"></i>
            Enviar
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Todo esto es lo de notificaciones y siempre ira al final -->
  <div class="notificaciones-overlay" id="notificacionesOverlay">
    <div class="panel-notificaciones" id="panelNotificaciones">
      <div class="p-4">
        <!-- Título -->
        <h6 class="titulo-notificaciones mb-0">Notificaciones</h3>
      </div>

            <div class="notificaciones-body px-4 pb-4">
                <!-- Contenido generado dinámicamente por js/controllers/notificaciones.js -->
            </div>
    </div>

    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--Links del script-->
    <script src="js/components/menu.js?v=15"></script>
    <script src="js/controllers/chatBot.js"></script>
    <script type="module" src="js/controllers/notificaciones.js"></script>

</body>

</html>
