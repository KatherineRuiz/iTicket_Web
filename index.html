<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login iTicket</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="css/login.css" rel="stylesheet" />
    <link href="css/common.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-lg-9 tarjeta-login">
                <svg class="curva-divisoria" viewBox="0 0 1600 977" preserveAspectRatio="none">
                    <path d="M-103-3 468 0c-9 78 41 154 105 217 67 63 141 129 218 202 79 76 108 190 52 342-43 89-76 137-146 239H-103Z"
                        fill="#f0f7f9" />
                </svg>

                <div class="row g-0 capa-contenido h-100">
                    <div class="col-md-6 d-none d-md-flex flex-column align-items-start justify-content-between p-4">
                        <img src="img/login/logo.png" alt="Logo iTicket" class="logo-sesion" />
                        <div class="d-flex align-items-center justify-content-center w-100 flex-grow-1">
                            <img src="img/login/img_Login1.png" alt="Ilustración"
                                class="img-fluid img-ilustracion-formulario mx-auto d-block" />
                        </div>
                    </div>

                    <div
                        class="col-12 col-md-6 d-flex align-items-center justify-content-center justify-content-md-end">
                        <div class="contenedor-formulario-compacto w-100 p-4 p-md-4 me-lg-5 text-white pb-5">

                            <img src="img/logo.png" alt="Logo iTicket"
                                class="logo-mobile d-block d-md-none mx-auto mb-3" />

                            <h2 class="mb-4 fw-bold text-center">
                                <span class="texto-bienvenida">Bienvenido a<br />iTicket</span>
                            </h2>

                            <form id="formLogin" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="txtCorreo">Correo electrónico</label>
                                    <input type="email" id="txtCorreo" class="form-control rounded-pill"
                                        placeholder="nombre@ejemplo.com" required />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="txtClave">Contraseña</label>
                                    <div class="position-relative">
                                        <input type="password" id="txtClave" class="form-control rounded-pill pe-5"
                                            placeholder="********" required />
                                        <button type="button"
                                            class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent text-secondary btn-toggle-ojo">
                                            <i class="bi bi-eye-slash"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="d-grid justify-content-center mt-4">
                                    <button type="submit" id="btnIniciarSesion"
                                        class="btn btn-azul-redondeado w-100 py-3 rounded-4 mb-4 fw shadow-sm text-white fs-10 d-flex align-items-center justify-content-center">
                                        Iniciar sesion
                                    </button>
                                </div>

                                <div class="text-center mt-3">
                                    <a href="recuperarContrasena.html"
                                        class="text-white-50 text-decoration-none small">¿Olvidaste tu contraseña?</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/components/frmValidaciones.js"></script>
    <script type="module" src="js/controllers/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
