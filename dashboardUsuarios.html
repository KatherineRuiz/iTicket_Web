<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/notificaciones.css">
    <script src="js/components/menu-cache.js"></script>
</head>

<body>
    <header id="contenedorMenuLateral"></header>
    <div class="menu-lateral-overlay" id="overlay"></div>

    <main class="main px-md-4 pt-3">
        <!--Parte superior-->
        <section class="superior rounded-5 ps-4 d-none d-md-flex">
            <h6 class="mb-0">Dashboard</h6>
            <div class="position-relative">
                <div class="perfil p-2 rounded-5 gap-lg-4 gap-md-2" id="perfilBienvenida">
                    <h6 class="perfil-nombre text-white mb-0 ps-2" id="nombrePerfil">Josué Guinea</h6>
                    <img src="img/user.png" alt="Icono de perfil" id="fotoPerfil">
                </div>
            </div>
        </section>

        <div class="contenido-principal container-fluid dashboard-personal dashboard-usuario">
            <div class="row g-4 m-0 p-0 align-items-center dashboard-personal-superior">
                <section class="col-lg-5 col-12">
                    <div class="bienvenida dashboard-bienvenida-admin d-flex justify-content-evenly align-items-center text-center p-3 shadow">
                        <img class="w-50" src="img/crearTicket.png" alt="Persona creando un ticket">
                        <div>
                            <h4 class="fw-bold">¡Bienvenido!</h4>
                            <h6 class="mb-3">¿Algún problema? Crea un ticket</h6>
                            <button class="btn-oscuro border-0 px-4 py-2 fw-bold rounded-pill">Crear</button>
                        </div>
                    </div>
                </section>

                <section class="col-lg-7 col-12 px-3 px-lg-5">
                    <h2 class="text-center bold dashboard-resumen-mes-titulo mb-3">Durante este mes:</h2>
                    <div class="row g-3 dashboard-kpis-personales">
                        <div class="col-md-6 col-12">
                            <div class="resumen-tickets dashboard-resumen-personal shadow-sm">
                                <h6 class="mb-0">Tickets<br>activos</h6>
                                <strong id="ticketsActivosUsuario">0</strong>
                                <span class="dashboard-resumen-personal-icono"><i class="bi bi-ticket-perforated"></i></span>
                            </div>
                        </div>
                        <div class="col-md-6 col-12">
                            <div class="resumen-tickets dashboard-resumen-personal shadow-sm">
                                <h6 class="mb-0">Tickets<br>finalizados</h6>
                                <strong id="ticketsFinalizadosUsuario">0</strong>
                                <span class="dashboard-resumen-personal-icono"><i class="bi bi-check2-circle"></i></span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="row px-3 pb-3 mt-1 g-4 align-items-stretch dashboard-admin-grid">
                <section class="col-xl-5 col-12">
                    <div class="dashboard-card-admin dashboard-grafica-admin bg-white rounded-5 p-4 shadow mt-4">
                        <h4 class="bold">Prioridades</h4>
                        <div class="grafico"><canvas id="graficoTickets"></canvas></div>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <div class="notificaciones-overlay" id="notificacionesOverlay">
        <aside class="panel-notificaciones" id="panelNotificaciones" aria-label="Notificaciones">
            <div class="p-4"><h6 class="titulo-notificaciones mb-0">Notificaciones</h6></div>
            <div class="notificaciones-body px-4 pb-4">
                <div class="notificaciones-vacio">
                    <i class="bi bi-bell-slash" aria-hidden="true"></i>
                    <h6>Sin notificaciones nuevas</h6>
                    <p>Cuando tengas una actualización importante aparecerá aquí.</p>
                </div>
            </div>
        </aside>
    </div>


    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--Libreria para los graficos-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!--Links del script-->
<script src="js/components/menu.js"></script>
    <script type="module" src="js/controllers/dashboardUsuario.js"></script>

</body>

</html>
