<body>
    <header id="contenedorMenuLateral"></header>
    <div class="menu-lateral-overlay" id="overlay"></div>

    <main class="main px-md-4 pt-3">
        <!--Parte superior-->
        <section class="superior rounded-5 ps-4 d-none d-md-flex">
            <h6 class="mb-0">Dashboard</h6>
            <div class="position-relative">
                <div class="perfil p-2 rounded-5 gap-lg-4 gap-md-2" id="perfilBienvenida">
                    <h6 class="perfil-nombre text-white mb-0 ps-2" id="nombrePerfil">Josué Guinea</h6>
                    <img src="img/user.png" alt="Icono de perfil" id="fotoPerfil">
                </div>
            </div>
        </section>

        <div class="contenido-principal container-fluid dashboard-personal dashboard-usuario">
            <div class="row px-3 pb-3 mt-1 g-4 align-items-start dashboard-admin-grid">
                <section class="col-xl-4 col-12">
                    <div class="bienvenida dashboard-bienvenida-admin d-flex justify-content-evenly align-items-center text-center p-3 shadow">
                        <img class="w-50" src="img/crearTicket.png" alt="Persona creando un ticket">
                        <div>
                            <h4 class="fw-bold">¡Bienvenido!</h4>
                            <h6 class="mb-3">¿Algún problema? Crea un ticket</h6>
                            <button class="btn-oscuro border-0 px-4 py-2 fw-bold rounded-pill">Crear</button>
                        </div>
                    </div>

                    <div class="dashboard-card-admin dashboard-grafica-admin bg-white rounded-5 p-4 shadow mt-4">
                        <h4 class="bold">Prioridades</h4>
                        <div class="grafico"><canvas id="graficoTickets"></canvas></div>
                    </div>
                </section>

                <section class="col-xl-4 col-12">
                    <div class="dashboard-card-admin dashboard-grafica-admin bg-white rounded-5 p-4 shadow">
                        <h4 class="bold">Tus evaluaciones</h4>
                        <div class="grafico"><canvas id="graficoEvaluacion"></canvas></div>
                    </div>

                    <div class="dashboard-card-admin bg-white rounded-5 p-4 shadow mt-3">
                        <h4 class="bold">Tiempo de respuesta</h4>
                        <div class="dashboard-tiempo-admin">
                            <div class="dashboard-tiempo-admin-contenido">
                                <i class="bi bi-clock-history"></i>
                                <div class="text-start">
                                    <strong><span id="tiempoPromedio">0</span> h</strong>
                                    <small class="d-block">Promedio de resolución</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="col-xl-4 col-12">
                    <div class="dashboard-card-admin dashboard-grafica-admin bg-white rounded-5 p-4 shadow">
                        <h4 class="bold">Últimos tickets</h4>
                        <div class="contenedor-lista-tickets" id="listaUltimosTickets">
                            <p class="text-muted text-center py-4 mb-0">Cargando tickets...</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="notificaciones-overlay" id="notificacionesOverlay">
        <aside class="panel-notificaciones" id="panelNotificaciones" aria-label="Notificaciones">
            <div class="p-4"><h6 class="titulo-notificaciones mb-0">Notificaciones</h6></div>
            <div class="notificaciones-body px-4 pb-4">
                <!-- Contenido generado dinámicamente por js/controllers/notificaciones.js -->
            </div>
        </aside>
    </div>


    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
