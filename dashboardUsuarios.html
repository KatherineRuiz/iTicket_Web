<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTicket</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css?v=6">
    <link rel="stylesheet" href="css/notificaciones.css?v=2">
    <link rel="stylesheet" href="css/tickets.css">
    <script src="js/components/menu-cache.js?v=17"></script>
</head>

<body>
    <header id="contenedorMenuLateral"></header>
    <div class="menu-lateral-overlay" id="overlay"></div>

    <main class="main px-md-4 pt-3">
        <!--Parte superior-->
        <section class="superior rounded-5 ps-4 d-none d-md-flex">
            <h6 class="mb-0">Dashboard</h6>
            <div class="position-relative">
                <div class="perfil p-2 rounded-5 gap-lg-4 gap-md-2" id="perfilBienvenida">
                    <h6 class="perfil-nombre text-white mb-0 ps-2" id="nombrePerfil">Josué Guinea</h6>
                    <img src="img/user.png" alt="Icono de perfil" id="fotoPerfil">
                </div>
            </div>
        </section>

        <div class="contenido-principal container-fluid dashboard-usuario">
            <div class="row g-4 m-0 p-0 align-items-stretch dashboard-admin-grid">
                <!--Bienvenida y prioridades, con las mismas medidas que en los otros dashboards-->
                <div class="col-xl-5 col-12 d-flex flex-column">
                    <div class="bienvenida d-flex justify-content-evenly align-items-center text-center p-3 shadow">
                        <img class="w-50" src="img/crearTicket.png" alt="Persona creando un ticket">
                        <div>
                            <h4 class="fw-bold">¡Bienvenido!</h4>
                            <h6 class="mb-3">¿Algún problema? Crea un ticket</h6>
                            <button class="btn-oscuro border-0 px-4 py-2 fw-bold rounded-pill">Crear</button>
                        </div>
                    </div>

                    <!--Prioridades de sus tickets. Crece para terminar a la misma altura
                        que la columna de "Últimos tickets"-->
                    <section
                        class="d-flex flex-column align-items-center text-center bg-white rounded-5 p-4 shadow mt-4 flex-grow-1">
                        <h4 class="p-3 bold">Prioridades</h4>
                        <div class="position-relative w-100 flex-grow-1 grafico-prioridades-usuario">
                            <canvas id="graficoTickets"></canvas>
                        </div>
                    </section>
                </div>

                <!--Últimos tickets, con el mismo encabezado que "Asignaciones" del técnico-->
                <section class="col-xl-7 col-12 d-flex px-xl-4">
                    <div class="w-100 d-flex flex-column dashboard-panel">
                        <div>
                            <h5 class="fw-bold mb-3 text-center p-3 titulo-seccion">Últimos tickets</h5>
                        </div>
                        <div class="bg-white rounded-5 p-4 shadow flex-grow-1 d-flex flex-column">
                            <div class="contenedor-lista-tickets" id="listaUltimosTickets">
                                <p class="text-muted text-center py-4 mb-0">Cargando tickets...</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="notificaciones-overlay" id="notificacionesOverlay">
        <aside class="panel-notificaciones" id="panelNotificaciones" aria-label="Notificaciones">
            <div class="p-4">
                <h6 class="titulo-notificaciones mb-0">Notificaciones</h6>
            </div>
            <div class="notificaciones-body px-4 pb-4">
                <!-- Contenido generado dinámicamente por js/controllers/notificaciones.js -->
            </div>
        </aside>
    </div>


    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--Libreria para los graficos-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!--Links del script-->
    <script src="js/components/menu.js?v=24"></script>
    <script type="module" src="js/controllers/notificaciones.js"></script>
    <script type="module" src="js/controllers/dashboardUsuario.js?v=7"></script>

</body>

</html>
