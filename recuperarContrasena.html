<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña</title>
    <!-- Abre desde ya la conexion con los servidores de fuentes y librerias. Sin esto
         el navegador recien los descubre al leer el CSS y pierde ese tiempo esperando. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/login.css" rel="stylesheet" />
  </head>

  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-lg-9 tarjeta-login">
          <svg
            class="curva-divisoria"
            viewBox="0 0 1600 977"
            preserveAspectRatio="none"
          >
            <path
              d="M-103-3 468 0c-9 78 41 154 105 217 67 63 141 129 218 202 79 76 108 190 52 342-43 89-76 137-146 239H-103Z"
              fill="#f0f7f9"
            />
          </svg>

          <div class="row g-0 capa-contenido h-100">
            <div class="col-md-6 d-none d-md-flex flex-column p-4">
              <!-- Regresa al inicio de sesion. En computadora ocupa el lugar que tenia
                   el logo: la esquina superior izquierda es donde se busca un "volver". -->
              <a href="index.html" class="btn-volver-sesion sobre-claro align-self-start">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
                Volver
              </a>
              <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                <img
                  src="img/login/img_Recuperarcontrasena.png"
                  alt="Ilustración"
                  class="img-fluid img-ilustracion-formulario"
                />
              </div>
            </div>

            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center justify-content-md-end">
              <div class="contenedor-formulario-compacto w-100 p-4 p-md-4 me-lg-5 text-white">
                <!-- El mismo boton para celular: ahi el panel de la izquierda se oculta,
                     asi que va encima del titulo. d-md-none lo esconde en computadora. -->
                <a href="index.html" class="btn-volver-sesion mb-3 d-md-none">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
                  Volver
                </a>
                <h2 class="mb-4 text-center">
                  <span class="texto-bienvenida fw-bold">¿Deseas recuperar<br />tu contraseña?</span>
                </h2>

                <div class="mb-4 text-center">
                  <span class="texto-fondo-especial d-inline-block">
                    Para recuperar su contraseña, se le enviará un código de
                    verificación a su correo.
                  </span>
                </div>

                <form id="formRecovery">
                  <div class="mb-3 fw-bold text-center">
                    <label class="form-label fw-semibold">
                      <span class="texto-fondo">Correo electrónico</span>
                    </label>
                    <input
                      type="email"
                      class="form-control rounded-pill"
                      placeholder="nombre@ejemplo.com"
                      required
                    />
                  </div>
                  <div class="d-grid mt-4">
                    <button
                      type="submit"
                      class="btn btn-azul rounded-pill text-white fw-bold"
                      id="btnEnviarCodigo"
                    >
                      Enviar código
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/components/frmValidaciones.js"></script>
    <script src="js/components/menu.js"></script>
    <script type="module" src="js/controllers/recuperarContrasena.js"></script>
    <script src="js/components/fondoBurbujas.js" defer></script>
  </body>
</html>
