<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTicket</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css?v=6">
    <link rel="stylesheet" href="css/tickets.css">
    <link rel="stylesheet" href="css/notificaciones.css?v=2">
    <script src="js/components/menu-cache.js?v=17"></script>
</head>

<body>
    <header id="contenedorMenuLateral"></header>
    <div class="menu-lateral-overlay" id="overlay"></div>

    <main class="main px-md-4 pt-3">
        <!--Parte superior-->
        <section class="superior rounded-5 ps-4 d-none d-md-flex">
            <h6 class="mb-0">Dashboard</h6>
            <div class="position-relative">
                <div class="perfil p-2 rounded-5 gap-lg-4 gap-md-2" id="perfilBienvenida">
                    <h6 class="perfil-nombre text-white mb-0 ps-2" id="nombrePerfil">Josué Guinea</h6>
                    <img src="img/user.png" alt="Icono de perfil" id="fotoPerfil">
                </div>
            </div>
        </section>

        <div class="contenido-principal container-fluid dashboard-tecnico">
            <div class="row g-4 m-0 p-0 align-items-stretch dashboard-admin-grid">
                <!--Bienvenida y gráfica, con las mismas medidas que en el dashboard del administrador-->
                <div class="col-xl-5 col-12 d-flex flex-column">
                    <div class="bienvenida d-flex justify-content-evenly align-items-center text-center p-3 shadow">
                        <img class="w-50" src="img/crearTicket.png" alt="Persona gestionando tickets">
                        <div>
                            <h4 class="fw-bold">¡Bienvenido!</h4>
                            <h6 class="mb-3">¿Algún problema? Crea un ticket</h6>
                            <button id="btnCrear" class="btn-oscuro border-0 px-4 py-2 fw-bold rounded-pill">Crear</button>
                        </div>
                    </div>

                    <!--Gráfico del tiempo de resolución promedio. Crece para terminar a la
                        misma altura que la columna de "Asignaciones"-->
                    <section
                        class="d-flex flex-column align-items-center text-center bg-white rounded-5 p-4 shadow mt-4 flex-grow-1">
                        <h4 class="p-3 bold">Tiempo de resolución</h4>
                        <div class="position-relative w-100 flex-grow-1 grafico-resolucion-tecnico">
                            <canvas id="graficoResolucion"></canvas>
                        </div>
                    </section>
                </div>

                <!--Sección de "Asignaciones": mismo diseño que "Mi resumen" del administrador-->
                <section class="col-xl-7 col-12 d-flex px-xl-4 dashboard-evaluaciones">
                    <div class="w-100 d-flex flex-column dashboard-panel">
                        <div>
                            <h5 class="fw-bold mb-3 text-center p-3 titulo-seccion">Asignaciones</h5>
                        </div>
                        <div class="mi-resumen flex-column flex-grow-1 w-100 shadow">
                            <!--Filtros de la sección-->
                            <div class="p-3">
                                <div class="row g-3 justify-content-center" id="botones-resumen">
                                    <div class="col-md-4 col-sm-12">
                                        <button type="button"
                                            class="btn btn-resumen d-flex align-items-center justify-content-between px-3 px-md-1 px-lg-3 py-2 rounded-4 activo"
                                            data-opcion="pendientes">
                                            <span class="opcion-texto text-start">Pendientes</span>
                                            <span class="opcion-numero" id="num-pendientes">0</span>
                                        </button>
                                    </div>

                                    <div class="col-md-4 col-sm-12">
                                        <button type="button"
                                            class="btn btn-resumen d-flex align-items-center justify-content-between px-3 py-2 rounded-4"
                                            data-opcion="vencidos">
                                            <span class="opcion-texto text-start">Vencidos</span>
                                            <span class="opcion-numero" id="num-vencidas">0</span>
                                        </button>
                                    </div>

                                    <div class="col-md-4 col-sm-12">
                                        <button type="button"
                                            class="btn btn-resumen d-flex align-items-center justify-content-between px-3 py-2 rounded-4"
                                            data-opcion="hoy">
                                            <span class="opcion-texto text-start">Vencen hoy</span>
                                            <span class="opcion-numero" id="num-hoy">0</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!--Tickets asignados al técnico-->
                            <div class="p-3 mx-3 flex-grow-1 d-flex">
                                <div class="bg-white p-3 rounded-4 shadow-sm contenedor-lista-tickets w-100">
                                    <div class="contenedor-tickets-scroll dashboard-lista-asignaciones">
                                        <div class="dashboard-cargando"><i class="bi bi-arrow-repeat"></i><span>Cargando tus
                                                tickets...</span></div>
                                    </div>
                                    <nav aria-label="Paginacion de asignaciones"
                                        class="d-flex justify-content-end mt-2">
                                        <ul class="pagination pagination-sm mb-0 align-items-center gap-1"
                                            id="paginacionAsignaciones"></ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="notificaciones-overlay" id="notificacionesOverlay">
        <aside class="panel-notificaciones" id="panelNotificaciones" aria-label="Notificaciones">
            <div class="p-4">
                <h6 class="titulo-notificaciones mb-0">Notificaciones</h6>
            </div>
            <div class="notificaciones-body px-4 pb-4">
                <!-- Contenido generado dinámicamente por js/controllers/notificaciones.js -->
            </div>
        </aside>
    </div>


    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--Libreria para los graficos-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!--Links del script-->
    <script src="js/components/menu.js?v=15"></script>
    <script type="module" src="js/controllers/notificaciones.js"></script>
    <script type="module" src="js/controllers/dashboardTecnico.js?v=10"></script>

</body>

</html>
