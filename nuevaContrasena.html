<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nueva Contraseña - iTicket</title>
        <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <link href="css/login.css" rel="stylesheet" />
    </head>

    <body class="d-flex align-items-center justify-content-center min-vh-100">
        <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-lg-9 tarjeta-login">
            <svg class="curva-divisoria" viewBox="0 0 1600 977" preserveAspectRatio="none">
                <path
                d="M-103-3 468 0c-9 78 41 154 105 217 67 63 141 129 218 202 79 76 108 190 52 342-43 89-76 137-146 239H-103Z"
                fill="#f0f7f9"
                />
            </svg>

            <div class="row g-0 capa-contenido h-100">
                <div class="col-md-6 d-none d-md-flex flex-column p-4">
                <img src="img/login/logo.png" alt="Logo iTicket" class="logo-sesion"/>
                <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                    <img src="img/login/nuevaContra.png" alt="Ilustración" class="img-fluid img-ilustracion-formulario"/>
                </div>
                </div>

                <div class="col-12 col-md-6 d-flex align-items-center justify-content-center justify-content-md-end">
                <div class="contenedor-formulario-compacto w-100 p-4 p-md-4 me-lg-5 text-white">
                    <h2 class="mb-4 fw-bold text-center">
                    Establece tu<br />nueva contraseña
                    </h2>

                    <div class="mb-4 text-center">
                    <span class="texto-fondo-especial d-inline-block">
                        Digite su nueva contraseña para poder acceder a su cuenta.
                    </span>
                    </div>

                    <form id="formNuevaContrasena">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nueva Contraseña</label>
                        <div class="position-relative">
                        <input type="password" class="form-control rounded-pill pe-5" placeholder="********" required />
                        <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent text-secondary btn-toggle-ojo">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirmar Contraseña</label>
                        <div class="position-relative">
                        <input type="password" class="form-control rounded-pill pe-5" placeholder="********" required />
                        <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent text-secondary btn-toggle-ojo">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-azul rounded-pill fw-bold text-white" id="btnRestablecer">
                        Restablecer Contraseña
                        </button>
                    </div>
                    </form>
                </div>
                </div>
            </div>
            </div>
        </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="js/components/sweetAlerts.js"></script>
        <script src="js/components/frmValidaciones.js"></script>
        <script src="js/components/menu.js"></script>
        <script src="js/Controllers/nuevaContrasena.js"></script>
    </body>
</html>
