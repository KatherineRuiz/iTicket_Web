<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Correo Enviado</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/login.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
          <div
          class="col-11 col-sm-8 col-md-6 col-lg-5 p-4 p-sm-5 d-flex flex-column align-items-center rounded-4 shadow-sm bg-white"
          >
          <div class="contenedor-formulario-compacto w-100 d-flex flex-column align-items-center">
              <img src="img/login/Logo.png" alt="Logo iTicket" class="logo-sesion mb-4"/>

              <div class="mb-4 w-100 text-center">
              <span class="texto-fondo-especial-codigo-validacion caja-titulo-validacion d-inline-block px-3 py-2 rounded-pill" style="font-size: 0.95rem;">
                  Para restablecer tu contraseña, hemos enviado un enlace mágico a tu correo.
              </span>
              </div>

              <div class="mb-4 text-center text-muted">
                <p class="fw-bold" style="font-size: 1.1rem;">¡REVISA TU BANDEJA DE ENTRADA!</p>
              </div>

              <div class="mb-4 text-center">
                <a href="#" id="btnAyudaCorreo" class="text-decoration-none fw-bold" style="color: #0e1b4d; font-size: 0.95rem;">
                  ¿No recibiste el correo?
                </a>
              </div>

              <a href="index.html" class="btn btn-azul rounded-pill w-100 text-white fw-bold">
                Volver al Login
              </a>
          </div>
          </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/components/menu.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnAyuda = document.getElementById("btnAyudaCorreo");
            if(btnAyuda){
                btnAyuda.addEventListener("click", function(e){
                    e.preventDefault();
                    Swal.fire({
                        icon: 'info',
                        title: '¿No encuentras el correo?',
                        html: '<ul style="text-align: left; font-size: 0.95rem; padding-left: 20px;">' +
                              '<li style="margin-bottom: 12px;">Revisa tu carpeta de <b>Spam</b> o Correo no deseado.</li>' +
                              '<li style="margin-bottom: 12px;">Asegúrate de haber ingresado el correo correctamente en la pantalla anterior.</li>' +
                              '<li style="margin-bottom: 12px;">Espera un par de minutos, a veces el servidor tarda en procesar.</li>' +
                              '<li style="margin-bottom: 12px;">Verifica que el almacenamiento de tu correo (Google/Outlook) no se encuentre lleno y rechazando mensajes.</li>' +
                              '</ul>',
                        confirmButtonText: 'Entendido',
                        confirmButtonColor: '#0d6efd'
                    });
                });
            }
        });
    </script>
</body>
</html>
