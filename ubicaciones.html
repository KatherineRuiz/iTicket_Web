<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="js/components/menu-cache.js"></script>
    <link rel="stylesheet" href="css/notificaciones.css">
    <link rel="stylesheet" href="css/common.css">
</head>

<body>
    <!-- Todo el header  -->
    <header id="contenedorMenuLateral"></header>
    <div class="menu-lateral-overlay" id="overlay"></div>

    <main class="main px-md-4 pt-3">

        <section class="superior rounded-5 ps-4 d-none d-md-flex">
            <h6 class="mb-0 bold">Ubicaciones</h6>
            <div class="position-relative">
                <div class="perfil p-2 rounded-5 gap-lg-4 gap-md-2" id="perfilBienvenida">
                    <h6 class="perfil-nombre text-white mb-0 ps-2" id="nombrePerfil">Bienvenida, Katherine</h6>
                    <div class="perfil-foto" id="fotoPerfil">
                        <span class="foto-letra" id="fotoLetra">K</span>
                        <img src="img/usuario.png" alt="Foto de perfil" class="foto-img" id="fotoDePerfil">
                    </div>
                </div>
            </div>
        </section>

        <div class="contenido-principal container-fluid mt-2 pb-5">

            <!-- SECCIÓN: Tipo de ubicación -->
            <div class="p-4">
                <div class="row g-4 align-items-stretch">

                    <div class="col-12">
                        <h5 class="fw-bold mb-0 titulo-seccion text-center p-3">Gestionar tipo de ubicacion</h5>
                    </div>

                    <div class="col-12 col-lg-5">
                        <div class="p-3 bg-light rounded-4 h-100">
                            <form id="formTipoUbicacion" novalidate class="h-100 d-flex flex-column justify-content-between">
                                <div class="py-2">
                                    <input type="hidden" id="tipoUbicacionId">
                                    <h6 class="fw-bold text-navy mb-3 text-center" id="tituloFormTipoUbicacion">Agregar tipo de ubicación</h6>

                                    <div class="mb-3">
                                        <label for="txtNombreTipoUbicacion" class="form-label small fw-bold text-navy">Nombre del
                                            tipo de
                                            ubicación</label>
                                        <input type="text" class="form-control rounded-3" id="txtNombreTipoUbicacion"
                                            maxlength="50" required>
                                    </div>
                                </div>

                                <div class="pt-2 mt-auto">
                                    <button type="submit"
                                        class="btn btn-azul-redondeado w-100 py-2 rounded-3 fw-bold text-white shadow-sm d-flex align-items-center justify-content-center">
                                        <i class="bi bi-check-circle me-2"></i> <span id="btnTextoTipoUbicacion">Guardar tipo de ubicación</span>
                                    </button>
                                    <button type="button" id="btnCancelarTipoUbicacion"
                                        class="btn btn-outline-secondary w-100 py-2 rounded-3 fw-bold mt-2 d-none">
                                        Cancelar edición
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Tabla Tipos de ubicación -->
                    <div class="col-12 col-lg-7">
                        <div class="p-3 bg-white border rounded-4 h-100 d-flex flex-column">
                            <h6 class="fw-bold text-navy mb-3 text-center pt-2">Tipo de ubicaciones existentes</h6>

                            <div class="card-tabla p-3 flex-grow-1">
                                <div class="table-responsive">
                                    <table class="table table-borderless table-custom align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th scope="col" class="text-center">Tipo de ubicación</th>
                                                <th scope="col" class="text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tablaTiposUbicacion">
                                            <!-- Se llena dinámicamente desde tipoUbicacionService.js -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- SECCIÓN: Ubicaciones específicas -->
            <div class="p-4">
                <div class="row g-4 align-items-stretch">

                    <div class="col-12">
                        <h5 class="fw-bold mb-0 titulo-seccion text-center p-3">Gestionar ubicaciones específicas</h5>
                    </div>

                    <div class="col-12 col-lg-5">
                        <div class="p-3 bg-light rounded-4 h-100">
                            <form id="formUbicacion" novalidate class="h-100 d-flex flex-column justify-content-between">
                                <div class="py-2">
                                    <input type="hidden" id="ubicacionId">
                                    <h6 class="fw-bold text-navy mb-3 text-center" id="tituloFormUbicacion">Agregar ubicación</h6>

                                    <div class="mb-3">
                                        <label for="txtNombreUbicacion" class="form-label small fw-bold text-navy">Nombre de la
                                            ubicación</label>
                                        <input type="text" class="form-control rounded-3" id="txtNombreUbicacion"
                                            maxlength="50" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="selectTipoUbicacion" class="form-label small fw-bold text-navy">Tipo de
                                        ubicación</label>
                                    <div class="input-group">
                                        <select class="form-select rounded-3 py-2 fs-6 shadow-sm" id="selectTipoUbicacion" required>
                                            <option selected disabled value="">Selecciona el tipo de ubicación...</option>
                                            <!-- Se llena dinámicamente al cargar la página -->
                                        </select>
                                    </div>
                                </div>

                                <div class="pt-2 mt-auto">
                                    <button type="submit"
                                        class="btn btn-azul-redondeado w-100 py-2 rounded-3 fw-bold text-white shadow-sm d-flex align-items-center justify-content-center">
                                        <i class="bi bi-check-circle me-2"></i> <span id="btnTextoUbicacion">Guardar ubicación</span>
                                    </button>
                                    <button type="button" id="btnCancelarUbicacion"
                                        class="btn btn-outline-secondary w-100 py-2 rounded-3 fw-bold mt-2 d-none">
                                        Cancelar edición
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Tabla Ubicaciones -->
                    <div class="col-12 col-lg-7">
                        <div class="p-3 bg-white border rounded-4 h-100 d-flex flex-column">
                            <h6 class="fw-bold text-navy mb-3 text-center pt-2">Ubicaciones existentes</h6>

                            <div class="card-tabla p-3 flex-grow-1">
                                <div class="table-responsive">
                                    <table class="table table-borderless table-custom align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th scope="col" class="text-center">Ubicación</th>
                                                <th scope="col" class="text-center">Tipo de ubicación</th>
                                                <th scope="col" class="text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tablaUbicaciones">
                                            <!-- Se llena dinámicamente desde ubicacionesService.js -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <!-- Todo esto es lo de notificaciones y siempre ira al final -->
    <div class="notificaciones-overlay" id="notificacionesOverlay">
        <div class="panel-notificaciones" id="panelNotificaciones">
            <div class="p-4">
                <h6 class="titulo-notificaciones mb-0">Notificaciones</h6>
            </div>
            <div class="notificaciones-body px-4 pb-4">
                <p class="text-muted small text-center pt-4">Próximamente</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/controllers/notificaciones.js"></script>
<script src="js/components/menu.js"></script>
    <script type="module" src="js/controllers/ubicaciones.js"></script>

</body>

</html>
