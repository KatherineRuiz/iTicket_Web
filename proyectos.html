<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/proyectos.css">
    <link rel="stylesheet" href="css/tickets.css">
    <script src="js/components/menu-cache.js"></script>
</head>

<body>
    <header id="contenedorMenuLateral"></header>
    <div class="menu-lateral-overlay" id="overlay"></div>

    <main class="main px-md-4 pt-3">

        <!--Parte superior-->
        <section class="superior rounded-5 ps-4 d-none d-md-flex">
            <h6 class="mb-0 bold">Proyectos</h6>
            <div class="position-relative">
                <div class="perfil p-2 rounded-5 gap-lg-4 gap-md-2" id="perfilBienvenida">
                    <h6 class="perfil-nombre text-white mb-0 ps-2" id="nombrePerfil">Bienvenida, Katherine</h6>
                    <div class="perfil-foto" id="fotoPerfil">
                        <span class="foto-letra" id="fotoLetra">K</span>
                        <img src="img/usuario.png" alt="Foto de perfil" class="foto-img" id="fotoDePerfil">
                    </div>
                </div>
            </div>
        </section>

        <div class="contenido-principal container-fluid">

            <div class="row g-5">
                <section class="col-lg-3 col-md-5 col-sm-12">

                    <div class="accion-crear-proyecto">
                        <button
                            class="btn btn-azul-redondeado btn-crear-proyecto w-100 mb-4 shadow-sm d-flex align-items-center justify-content-center"
                            data-bs-toggle="modal" data-bs-target="#modalCrearProyecto">
                            <i class="bi bi-plus-lg me-2"></i> Crear proyecto
                        </button>
                    </div>

                    <!--Sección de proyectos-->
                    <div class="card border-0 shadow-sm text-center p-2 rounded-4 mx-sm-5 mx-md-0 mb-4 mb-md-3">
                        <div class="card-body">
                            <h5 class="card-title fw-bold mb-3">Proyectos<br>totales</h5>
                            <p class="card-text fw-bolder fs-1 m-0" id="txtTotalProyectos">0</p>
                        </div>
                    </div>
                    <div class="card border-0 shadow-sm text-center p-2 rounded-4 mx-sm-5 mx-md-0 mb-4 mb-md-0">
                        <div class="card-body">
                            <h5 class="card-title fw-bold mb-3">Proyectos<br>terminados</h5>
                            <p class="card-text fw-bolder fs-1 m-0" id="txtProyectosTerminados">0</p>
                        </div>
                    </div>

                    <!--Gráfico del procentaje de proyectos según su tipo-->
                    <section class="row mt-4 px-2">
                        <div class="d-flex flex-column align-items-center text-center bg-white rounded-5 p-4 shadow">
                            <h4>Tipos de proyectos</h4>
                            <div class="grafico">
                                <canvas id="graficoTipoProyecto"></canvas>
                            </div>
                        </div>
                    </section>
                </section>

                <section class="col-lg-9 col-md-7 col-sm-12">
                    <h5 class="fw-bold mb-3 titulo-seccion text-center p-3">Proyectos</h5>

                    <!-- Sección del Buscador y Filtros -->
                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-12 col-md-6 col-lg-7">
                            <div class="buscador-contenedor">
                                <i class="bi bi-search icono-busqueda"></i>
                                <input type="text" class="form-control buscador-input" id="txtBuscarProyecto"
                                    placeholder="Ingresa el nombre del proyecto">
                            </div>
                        </div>

                        <!-- Filtro por Tipo de proyecto -->
                        <div class="col-6 col-md-3 col-lg-3">
                            <select class="form-select select-ticket-filtro" id="sltFiltroTipo">
                                <option value="" selected>Tipo</option>
                                <option value="Construcción">Construcción</option>
                                <option value="Remodelación">Remodelación</option>
                                <option value="Ampliación">Ampliación</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                            </select>
                        </div>

                        <!-- Filtro de Fecha -->
                        <div class="col-6 col-md-3 col-lg-2">
                            <input type="date" class="form-control select-ticket-filtro" id="dtFiltroFecha">
                        </div>
                    </div>

                    <!--Sección de proyectos-->
                    <section class="row bg-white g-4 rounded-4 p-4 mt-4 contenedor-proyectos" id="contenedorProyectos">
                        <p class="text-muted text-center w-100 my-4" id="txtSinProyectos">Cargando proyectos...</p>
                    </section>

                </section>
            </div>

        </div>

        <!-- Modal para crear proyecto -->
        <div class="modal fade" tabindex="-1" id="modalCrearProyecto" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content rounded-5 overflow-hidden bg-white">

                    <div class="modal-header text-center border-0 mb-3 position-relative">
                        <h5 class="modal-title titulo-seccion text-white fw-bold w-100 fs-2 p-1">Crear Proyecto
                        </h5>
                        <button type="button" class="btn-close btn-close-white position-absolute end-0 me-3"
                            data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body px-4 pb-4 pt-1">
                        <form id="formCrearProyecto" novalidate>

                            <div class="p-3 mb-4 rounded-4 shadow bg-white">
                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <label for="txtNombreProyecto" class="form-label text-navy fw-semibold">Nombre
                                            del
                                            proyecto</label>
                                        <input type="text" class="form-control" id="txtNombreProyecto" maxlength="100"
                                            required>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="tipoProyecto" class="form-label text-navy fw-semibold">Tipo de
                                            proyecto</label>
                                        <select class="form-select" id="tipoProyecto" required>
                                            <option value="" selected disabled>Selecciona</option>
                                            <option value="Construccion">Construcción</option>
                                            <option value="Remodelacion">Remodelación</option>
                                            <option value="Ampliacion">Ampliación</option>
                                            <option value="Mantenimiento">Mantenimiento</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="txtUbicacion"
                                            class="form-label text-navy fw-semibold">Ubicación</label>
                                        <input type="text" class="form-control" id="txtUbicacion" maxlength="100"
                                            required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="txtContratista" class="form-label text-navy fw-semibold">Contratista
                                            <span class="text-muted fw-normal">(opcional)</span></label>
                                        <input type="text" class="form-control" id="txtContratista" maxlength="100">
                                    </div>

                                    <div class="col-12">
                                        <label for="txtDescripcion"
                                            class="form-label text-navy fw-semibold">Descripción</label>
                                        <textarea class="form-control" id="txtDescripcion" rows="3" maxlength="300"
                                            required></textarea>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="numPresupuesto" class="form-label text-navy fw-semibold">Presupuesto
                                            estimado</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="number" class="form-control" id="numPresupuesto" min="0"
                                                max="100000000" step="0.01" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="txtCoordinador" class="form-label text-navy fw-semibold">Correo del
                                            coordinador</label>
                                        <input type="email" class="form-control" id="txtCoordinador" maxlength="100"
                                            placeholder="usuario@ricaldone.edu.sv" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="txtSupervisor" class="form-label text-navy fw-semibold">Correo del
                                            supervisor</label>
                                        <input type="email" class="form-control" id="txtSupervisor" maxlength="100"
                                            placeholder="usuario@ricaldone.edu.sv" required>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button type="button" class="btn btn-outline-secondary rounded-pill px-4"
                                    data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-azul-redondeado px-4">
                                    Crear y continuar
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!--Libreria para los graficos-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!--Libreria para las alertas-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!--Links del script-->
<script src="js/components/menu.js"></script>
    <script type="module" src="js/controllers/proyectos.js"></script>

</body>

</html>
